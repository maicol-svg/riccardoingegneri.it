<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<!-- Monogramma «RI»: tre proposte. Si vedono qui a grandezza piena e come icona delle schede (32 e 16 px).
     I PNG si rifanno con: python strumenti/logo/logo.py -->
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@700&family=Instrument+Serif&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:40px;background:#f8f9fb;font-family:'Atkinson Hyperlegible',sans-serif;color:#18202f}
h1{font-family:'Instrument Serif',serif;font-weight:400;color:#1d3d8a;font-size:44px;margin:0 0 30px}
.riga{display:flex;gap:56px;flex-wrap:wrap}
.prova{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.prova b{font-size:22px;color:#1d3d8a}
.piccole{display:flex;gap:18px;align-items:center}
.tab{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;background:#dee1e6;border-radius:9px 9px 0 0;font:13px system-ui,sans-serif;color:#202124}

/* le icone: quadrato 512, scalato con zoom per le prove piccole */
.ico{width:512px;height:512px;position:relative;overflow:hidden;flex:none}
.p256{zoom:.5}.p32{zoom:.0625}.p16{zoom:.03125}

/* A · evidenziatore: come il titolo della home */
.a{background:#f8f9fb;border-radius:104px;box-shadow:inset 0 0 0 22px #1d3d8a}
.a span{position:absolute;left:0;right:0;top:44px;text-align:center;font-family:'Instrument Serif',serif;font-size:390px;line-height:1;color:#1d3d8a;letter-spacing:-14px;z-index:1}
.a::before{content:"";position:absolute;left:78px;right:70px;top:268px;height:118px;background:#f3d74a;border-radius:10px 34px 20px 8px;transform:rotate(-2deg)}

/* B · timbro: pieno blu, lettere bianche, tratto giallo */
.b{background:#1d3d8a;border-radius:104px}
.b span{position:absolute;left:0;right:0;top:40px;text-align:center;font-family:'Instrument Serif',serif;font-size:390px;line-height:1;color:#fff;letter-spacing:-14px}
.b::after{content:"";position:absolute;left:120px;right:120px;bottom:72px;height:34px;background:#f3d74a;border-radius:6px 20px 12px 4px;transform:rotate(-2deg)}

/* C · firma: «Ri» scritto a mano su un cerchio giallo */
.c{background:#f3d74a;border-radius:50%;box-shadow:inset 0 0 0 20px #1d3d8a}
.c span{position:absolute;left:0;right:0;top:46px;text-align:center;font-family:'Caveat',cursive;font-weight:700;font-size:360px;line-height:1;color:#1d3d8a;transform:rotate(-6deg)}

/* C2 · sigla: R e I separate, la I si appoggia sulla gamba della R; C3 aggiunge il ricciolo della firma */
.s{background:#f3d74a;border-radius:50%;box-shadow:inset 0 0 0 20px #1d3d8a}
.s .r,.s .i{position:absolute;font-family:'Caveat',cursive;font-weight:700;line-height:1;color:#1d3d8a}
.s .r{left:96px;top:30px;font-size:350px;transform:rotate(-8deg)}
.s .i{left:238px;top:66px;font-size:310px;transform:rotate(6deg)}
.s svg{position:absolute;left:0;top:0;width:512px;height:512px}
</style>
</head>
<body>
<h1>Monogramma</h1>
<div class="riga">
  <div class="prova"><b>A · Evidenziatore</b><div class="ico p256 a" id="a"><span>RI</span></div>
    <div class="piccole"><div class="tab"><div class="ico p16 a"><span>RI</span></div>Riccardo Ingegneri</div><div class="ico p32 a"><span>RI</span></div></div></div>
  <div class="prova"><b>B · Timbro</b><div class="ico p256 b" id="b"><span>RI</span></div>
    <div class="piccole"><div class="tab"><div class="ico p16 b"><span>RI</span></div>Riccardo Ingegneri</div><div class="ico p32 b"><span>RI</span></div></div></div>
  <div class="prova"><b>C · Firma</b><div class="ico p256 c" id="c"><span>Ri</span></div>
    <div class="piccole"><div class="tab"><div class="ico p16 c"><span>Ri</span></div>Riccardo Ingegneri</div><div class="ico p32 c"><span>Ri</span></div></div></div>
</div>
<div style="height:40px"></div>
<div class="riga">
  <div class="prova"><b>C2 · Sigla</b><div class="ico p256 s"><span class="r">R</span><span class="i">I</span></div>
    <div class="piccole"><div class="tab"><div class="ico p16 s"><span class="r">R</span><span class="i">I</span></div>Riccardo Ingegneri</div><div class="ico p32 s"><span class="r">R</span><span class="i">I</span></div></div></div>
  <div class="prova"><b>C3 · Sigla con ricciolo (scelta)</b><div class="ico p256 s" id="sigla"><span class="r">R</span><span class="i">I</span><svg viewBox="0 0 512 512"><path d="M124 398 C 196 376, 298 368, 392 350 C 410 346, 408 361, 393 364" fill="none" stroke="#1d3d8a" stroke-width="16" stroke-linecap="round"/></svg></div>
    <div class="piccole"><div class="tab"><div class="ico p16 s"><span class="r">R</span><span class="i">I</span><svg viewBox="0 0 512 512"><path d="M124 398 C 196 376, 298 368, 392 350 C 410 346, 408 361, 393 364" fill="none" stroke="#1d3d8a" stroke-width="16" stroke-linecap="round"/></svg></div>Riccardo Ingegneri</div><div class="ico p32 s"><span class="r">R</span><span class="i">I</span><svg viewBox="0 0 512 512"><path d="M124 398 C 196 376, 298 368, 392 350 C 410 346, 408 361, 393 364" fill="none" stroke="#1d3d8a" stroke-width="16" stroke-linecap="round"/></svg></div></div></div>
</div>
</body>
</html>
